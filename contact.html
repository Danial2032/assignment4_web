<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="contact-custom.css">
  </head>
  <body>
    <div class="container my-5" style="max-width: 600px;">
      <div class="card p-4 custom-card">
        <h2 class="mb-4 text-center fw-bold">Contact Us</h2>

        <form action=# method="POST">

          <div class="mb-3">
            <label for="contactName" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="ContactName" placeholder="Alibayev Danial" required maxlength="50">
          </div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="contactEmail" placeholder="Danial@example.com" required>
            <div class="form-text">Email is safe</div>
          </div>

          <div class="mb-4">
            <label for="contactMessage" class="form-label fw-semibold">Message</label>
            <textarea class="form-control id="contactMessage" rows="4" placeholder="Write your message here..." required maxlength="500"></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">Send Message</button>

          <div class="text-center mt-3">
            <a href="index.html">Registration Form</a>
            </div>
          
        </form>
      </div>
    </div>
    
  </body>
</html>
