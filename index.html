<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale=1.0>
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register-custom.css">
  </head>
<body>
  <div class="container my-5 style="max-width: 720px;">
    <div class="card p-4 register-card">
      <h2 class="card-title mb-4 text-center fw-bold">Create Account</h2>

      <form class="was-validated">

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="firstName" class="form-label fw-semibold">First Name</label>
            <input type="text" class="form-control" id="firstName" required maxlength="30">
          </div>
          <div class="col-md-6">
            <label for="lastName" class="form-label fw-semibold">Last Name</label>
            <input type="text" class="form-control" id="lastName" required maxlength="30">
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label fw-semibold">Email Address</label>
          <input type="email" class="form-control" id="regEmail" placeholder="Danial@example.com" required>
          <div class="valid-feedback">Looks good</div>
          <div class="invalid-feedback">Enter a valid email address</div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" minlength="8" required>
            <div class="form-text">Minimum 8 characters</div>
            <div class="valid-feedback">Strong password</div>
            <div class="invalid-feedback"> At least 8 characters</div>
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" minlength="8" required>
            <div class="valid-feedback">Passwords match</div>
            <div class="invalid-feedback">Passwords are different</div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold d-block">Gender</label>
          <div class="custom-check-group">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="genderOptions" id="genderMale" value="male" required>
              <label class="form=check-label" for="genderMale">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="genderOptions" id="genderFemale" value="female" required>
              <label class="form-check-label" for="genderFemale">Female</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="genderOptions" id="genderOther" value="other" required>
              <label class="form-check-label" for="genderOther">Other</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold d-block">Hobbies</label>
          <div class="custom-check-group">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
              <label class="form-check-label" for="hobbyReading">Reading</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
              <label class="form-check-label" for="hobbySports">Sports</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
              <label class="form-check-label" for="hobbyMusic">Music</label>
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label for="countrySelect" class="form-label fw-semibold">Country</label>
          <select class="form-select" id="countrySelect" required>
            <option value="" selected disabled>Choose a country...</option>
            <option value="KZ">Kazakhstan</option>
            <option value="US">United States</option>
            <option value="UK">United Kingdom</option>
            <option value="CA">Canada</option>
          </select>
          <div class="valid-feedback">Country selected</div>
          <div class="invalid-feedback">Select country</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-custom=primary w-50">Register</button>
          <button type="reset" class="btn btn-custom-secondary w-50">Reset</button>
        </div>

        <div class="text-center mt-3">
          <a href="contact.html">Contact Us</a>
          </div>

      </form>
    </div>
  </div>
  
</body>
</html>
